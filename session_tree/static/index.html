<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Tree</title>
<style>
/* Layout: one-screen board of repo cards in flowing columns; each card is a git graph of local worktree branches (fork lines + ahead/behind), with sessions hanging off the branch they run on. */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --surface-2: #F5F7F9;
  --line: #DADFE6; --line-strong: #AEB7C3;
  --fg: #151A21; --muted: #586170; --faint: #838C9B;
  --accent: #2B59D9; --accent-soft: #E3EAFB; --on-accent: #FFFFFF;
  --ok: #157647; --ok-soft: #DCF1E5;
  --warn: #A9480D; --warn-soft: #FBE8DA;
  --closed: #717A88; --closed-soft: #E7EAEE;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015; --surface: #141920; --surface-2: #1A2029;
    --line: #262D38; --line-strong: #46505F;
    --fg: #E4E8EE; --muted: #9AA3B2; --faint: #6E7888;
    --accent: #7EA1FF; --accent-soft: #1B2846; --on-accent: #0D1015;
    --ok: #4CC38A; --ok-soft: #133224;
    --warn: #F2924A; --warn-soft: #372314;
    --closed: #808A99; --closed-soft: #1F252E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015; --surface: #141920; --surface-2: #1A2029;
  --line: #262D38; --line-strong: #46505F;
  --fg: #E4E8EE; --muted: #9AA3B2; --faint: #6E7888;
  --accent: #7EA1FF; --accent-soft: #1B2846; --on-accent: #0D1015;
  --ok: #4CC38A; --ok-soft: #133224;
  --warn: #F2924A; --warn-soft: #372314;
  --closed: #808A99; --closed-soft: #1F252E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 13px; line-height: 1.4; padding-block: 14px 90px; padding-inline: 16px; }
.wrap { max-width: 1680px; margin: 0 auto; display: grid; gap: 10px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.top .sub { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-weight: 500; }
.chip b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.c-idle b { color: var(--ok); } .c-busy b { color: var(--accent); } .c-closed b { color: var(--closed); } .c-shared b { color: var(--warn); }
.live { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s ease-in-out infinite; }
.live.down i { background: var(--warn); animation: none; }

.down-banner { padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.down-banner code { font-family: var(--mono); color: var(--fg); }

.alerts { display: flex; flex-wrap: wrap; gap: 6px; }
.alert { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 8px; padding: 4px 10px; font-size: 12px; border: 1px solid transparent; text-align: left; }
.alert .k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.alert.info { background: var(--surface); color: var(--muted); border-color: var(--line); }
.alert .t { color: var(--fg); font-family: var(--mono); }

.board { columns: 4 380px; column-gap: 12px; }
.board.stale { opacity: 0.55; }
.card { break-inside: avoid; display: block; margin: 0 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; scroll-margin-top: 12px; }
.card.flash { animation: flash 1.2s ease-out; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; padding: 9px 12px 7px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.card-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--fg); }
.card-head .path { flex-basis: 100%; padding-left: 18px; font-family: var(--mono); font-size: 11px; color: var(--faint); overflow-wrap: anywhere; }
.card-head .counts { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-head .counts .w { color: var(--warn); font-weight: 600; }
.card-body { padding: 8px 12px 8px; }
.rdot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--line-strong); }
.rdot.r-shared { background: var(--warn); } .rdot.r-busy { background: var(--accent); } .rdot.r-idle { background: var(--ok); }
.rdot.r-closed { background: transparent; box-shadow: inset 0 0 0 2px var(--closed); }
.card-error { margin: 0 0 6px; padding: 6px 9px; border-radius: 7px; background: var(--warn-soft); color: var(--warn); font-size: 12px; }

.graph { position: relative; }
.graph svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.graph path { fill: none; stroke: var(--line-strong); stroke-width: 2; }
.graph path.from-ghost { stroke-dasharray: 3 3; }
.node { position: relative; padding-left: calc(var(--d) * 20px + 24px); padding-block: 3px; }
.dot { position: absolute; left: calc(var(--d) * 20px + 3px); top: 7px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); z-index: 1; }
.dot.ghost { border-style: dashed; }
.dot.d-busy { border-color: var(--accent); background: var(--accent); }
.dot.d-idle { border-color: var(--ok); background: var(--ok); }
.dot.d-shared { border-color: var(--warn); background: var(--warn); }
.dot.d-closed { border-color: var(--closed); }
.nhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-height: 20px; }
.branch { font-family: var(--mono); font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.branch.detached { font-style: italic; color: var(--muted); }
.node.ghost .branch { color: var(--faint); font-weight: 400; }
.delta { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.delta .a { color: var(--ok); } .delta .b.far { color: var(--warn); }
.where { font-family: var(--mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.where.main { color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.add { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 0 7px; font-size: 11.5px; color: var(--muted); cursor: pointer; line-height: 18px; }
.add:hover { color: var(--fg); border-color: var(--line-strong); }
.note { font-size: 11.5px; color: var(--muted); margin: 1px 0; }
.note.warn { color: var(--warn); font-weight: 600; }
.node.dim .nhead, .node.dim .note { opacity: 0.4; }

.sessions { list-style: none; margin: 2px 0; padding: 0; display: grid; gap: 1px; }
.sline { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; border-radius: 6px; }
.sline:hover, .sline.open { background: var(--surface-2); }
.sline.dim { opacity: 0.35; }
.sline > .btn { margin-right: 4px; }
.sess { width: 100%; display: grid; grid-template-columns: 74px minmax(0, 1fr); grid-template-areas: "pill title" ". sub"; align-items: start; gap: 1px 8px; padding: 3px 6px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
.sess .pill { margin-top: 1px; }
.pill { grid-area: pill; display: inline-flex; align-items: center; gap: 5px; justify-self: start; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-busy { background: var(--accent-soft); color: var(--accent); } .st-busy i { animation: pulse 1.2s ease-in-out infinite; }
.st-idle { background: var(--ok-soft); color: var(--ok); }
.st-closed { background: var(--closed-soft); color: var(--closed); } .st-closed i { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.st-other { background: var(--surface-2); color: var(--muted); }
.stitle { grid-area: title; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.stitle.untitled { color: var(--muted); font-weight: 500; font-style: italic; }
.ssub { grid-area: sub; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ssub .sname { font-size: 11px; color: var(--faint); margin-right: 6px; }
.stime { font-size: 11.5px; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; margin-right: 6px; }
.detail { margin: 2px 0 6px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 6px; }
.detail p { margin: 0; overflow-wrap: anywhere; }
.detail .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.detail .warnline { color: var(--warn); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line-strong); color: var(--fg); }
.btn:disabled { opacity: 0.55; cursor: progress; }

details.loose { margin: 4px 0 0; }
details.loose summary { cursor: pointer; color: var(--faint); font-size: 11.5px; }
.bchips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.bchips span { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.nogit { color: var(--muted); font-size: 12px; margin: 0 0 4px; }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
.empty strong { color: var(--fg); display: block; margin-bottom: 4px; }

.toast { position: fixed; left: 16px; right: 16px; bottom: 14px; max-width: 760px; margin: 0 auto; z-index: 10; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); padding: 10px 12px; display: grid; gap: 6px; }
.toast-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.toast-head .btn { margin-left: auto; }
.toast pre { margin: 0; overflow-x: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 12px; }
.toast p { margin: 0; color: var(--muted); font-size: 12px; }
.toast.error .toast-head { color: var(--warn); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.foot { color: var(--faint); font-size: 11.5px; max-width: 90ch; margin: 0; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Session Tree</h1>
    <span class="sub" id="sub">Loading…</span>
    <div class="filters" id="filters" role="group" aria-label="Highlight sessions"></div>
    <span class="live" id="live"><i></i><span id="fresh">Connecting…</span></span>
  </header>
  <div class="down-banner" id="down" hidden>Session Tree server is not running. Start it with <code>uv run python -m session_tree</code>, then this page reconnects by itself.</div>
  <div class="alerts" id="alerts" aria-label="Needs attention"></div>
  <main class="board" id="board"></main>
  <p class="foot" id="foot">Parent branches are inferred from the nearest fork point, since git does not record them. Closed sessions stay listed for 24 hours.</p>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script>
const POLL_MS = 3000;
const CLOCK_MS = 30000;
const LABEL = { busy: "Working", idle: "Your turn", closed: "Closed" };
let board = null;
let signature = "";
let lastRender = 0;
let filter = "all";
let openId = null;
let inFlight = false;
let serverDown = false;
const openLoose = new Set();

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(min) {
  if (min < 1) return "now";
  if (min < 60) return min + " m";
  if (min < 1440) return Math.floor(min / 60) + " h " + (min % 60) + " m";
  return Math.floor(min / 1440) + " d " + Math.floor((min % 1440) / 60) + " h";
}
function minutesSince(ms) { return Math.max(0, Math.floor((Date.now() - ms) / 60000)); }
function shortPath(p) {
  const h = board && board.home;
  return h && p && p.toLowerCase().startsWith(h.toLowerCase()) ? "~" + p.slice(h.length) : p;
}
function allSessions() {
  const out = [];
  (board ? board.repos : []).forEach(r => r.nodes.forEach(n => n.sessions.forEach(s => out.push({ s, r, n }))));
  return out;
}
function matches(s, n) {
  if (filter === "all") return true;
  if (filter === "shared") return n.shared && s.live;
  return s.state === filter;
}
function nodeState(n) {
  if (n.shared) return "d-shared";
  if (n.sessions.some(s => s.state === "busy")) return "d-busy";
  if (n.sessions.some(s => s.state === "idle")) return "d-idle";
  if (n.sessions.length) return "d-closed";
  return "";
}
// Depth-first order so each branch sits under the branch it forked from.
function ordered(r) {
  const ids = new Set(r.nodes.map(n => n.id));
  const kids = {};
  r.nodes.forEach(n => { const k = n.parent && ids.has(n.parent) ? n.parent : "__root"; (kids[k] = kids[k] || []).push(n); });
  const rank = n => (n.sessions.some(s => s.live) ? 0 : n.sessions.length ? 1 : n.is_main ? 2 : 3);
  const out = [];
  const seen = new Set();
  const walk = (key, d) => (kids[key] || []).slice().sort((a, b) => rank(a) - rank(b)).forEach(n => {
    if (seen.has(n.id)) return;
    seen.add(n.id); out.push({ n, d }); walk(n.id, d + 1);
  });
  walk("__root", 0);
  return out;
}

function sessionLine(s, r, n) {
  const mins = minutesSince(s.since_ms);
  const time = !s.live ? (mins < 1 ? "closed just now" : "closed " + fmt(mins) + " ago") : s.state === "busy" ? "active now" : s.state === "idle" ? "waiting " + fmt(mins) : esc(s.status_raw);
  const open = openId === s.id;
  const title = s.title ? `<span class="stitle">${esc(s.title)}</span>` : `<span class="stitle untitled">No title yet</span>`;
  let main = "";
  if (s.live && s.can_focus) main = `<button type="button" class="btn primary" data-act="goto" data-sid="${esc(s.id)}" title="Switch to the terminal tab running this session">Go to terminal</button>`;
  else if (!s.live) main = `<button type="button" class="btn ghost" data-act="resume" data-sid="${esc(s.id)}">Resume</button>`;
  let detail = "";
  if (open) {
    const up = s.started_ms ? ` · up ${fmt(minutesSince(s.started_ms))}` : "";
    const meta = s.live ? `PID ${esc(s.pid)}${up} · ` : "";
    const second = s.live
      ? `<p class="warnline">${s.can_focus ? "Opening a second copy starts another terminal writing to the same conversation as the one already open." : "This session has no title yet, so its tab cannot be found. You can open a second copy instead."}</p>
         <div class="actions"><button type="button" class="btn ghost" data-act="resume" data-sid="${esc(s.id)}">Open a second copy</button><button type="button" class="btn ghost" data-act="close-detail">Close</button></div>`
      : `<div class="actions"><button type="button" class="btn primary" data-act="resume" data-sid="${esc(s.id)}">Resume in terminal</button><button type="button" class="btn ghost" data-act="close-detail">Close</button></div>`;
    detail = `<div class="detail">
      <p><strong>${esc(s.title || "No title yet")}</strong></p>
      <p>Last prompt: ${s.prompt ? esc(s.prompt) : "<em>none found</em>"}</p>
      <p class="meta">${meta}${esc(s.name)} · session ${esc(s.id)} · ${esc(shortPath(s.cwd))}</p>
      ${second}
    </div>`;
  }
  const label = LABEL[s.state] || s.status_raw || "Unknown";
  return `<li>
    <div class="sline ${matches(s, n) ? "" : "dim"} ${open ? "open" : ""}">
      <button type="button" class="sess" data-sid="${esc(s.id)}" aria-expanded="${open}">
        <span class="pill st-${esc(s.state)}"><i></i>${esc(label)}</span>
        ${title}
        <span class="ssub"><span class="stime">${time}</span><span class="sname mono">${esc(s.name)}</span>${esc(s.prompt)}</span>
      </button>${main}
    </div>${detail}
  </li>`;
}

function addButton(path, label) {
  return `<button type="button" class="add" data-act="new" data-path="${esc(path)}" title="Start a new Claude Code session in ${esc(label)}">+ session</button>`;
}

function nodeRow(r, n, d) {
  const anyMatch = n.sessions.some(s => matches(s, n));
  const dim = filter !== "all" && !anyMatch;
  const list = n.sessions.length ? `<ul class="sessions">${n.sessions.map(s => sessionLine(s, r, n)).join("")}</ul>` : "";
  if (r.nogit) {
    return `<div class="node ${dim ? "dim" : ""}" style="--d:0"><span class="dot ${nodeState(n)}" data-node="${esc(n.id)}"></span>
      <div class="nhead"><span class="where">${esc(n.where)}</span>${r.error ? "" : addButton(n.path, n.id)}</div>${list}</div>`;
  }
  if (n.ghost) {
    return `<div class="node ghost ${filter !== "all" ? "dim" : ""}" style="--d:${d}"><span class="dot ghost" data-node="${esc(n.id)}"></span>
      <div class="nhead"><span class="branch">${esc(n.id)}</span><span class="where">no worktree · base</span></div></div>`;
  }
  const label = n.detached ? `${esc(n.id)} <span class="where">detached @ ${esc(n.sha)}</span>` : esc(n.id);
  const delta = n.parent ? `<span class="delta" title="Commits ahead of / behind ${esc(n.parent)}"><span class="a">+${n.ahead}</span> <span class="b ${n.behind > 50 ? "far" : ""}">−${n.behind}</span></span>` : "";
  const where = n.is_main ? `<span class="where main">main checkout</span>` : `<span class="where">${esc(n.where)}</span>`;
  const liveCount = n.sessions.filter(s => s.live).length;
  const shared = n.shared ? `<p class="note warn">${liveCount} live sessions share this worktree. Their edits can overwrite each other.</p>` : "";
  const drift = n.sessions.filter(s => s.ran_on && n.branch && s.ran_on !== "HEAD" && s.ran_on !== n.branch)
    .map(s => `<p class="note">Session ${esc(s.name)} ran on <span class="mono">${esc(s.ran_on)}</span>; this worktree is now on <span class="mono">${esc(n.branch)}</span>.</p>`).join("");
  return `<div class="node ${dim ? "dim" : ""}" style="--d:${d}">
    <span class="dot ${nodeState(n)}" data-node="${esc(n.id)}" ${n.parent ? `data-parent="${esc(n.parent)}"` : ""}></span>
    <div class="nhead"><span class="branch ${n.detached ? "detached" : ""}">${label}</span>${delta}${where}${addButton(n.path, n.id)}</div>
    ${shared}${drift}${list}
  </div>`;
}

function card(r) {
  const wts = r.nodes.filter(n => !n.ghost).length;
  const live = r.nodes.reduce((k, n) => k + n.sessions.filter(s => s.live).length, 0);
  const sharedCount = r.nodes.filter(n => n.shared).length;
  const counts = (r.nogit ? "" : `${wts} worktree${wts === 1 ? "" : "s"} · `) + `${live} live` + (sharedCount ? ` · <span class="w">${sharedCount} shared</span>` : "");
  const ss = r.nodes.flatMap(n => n.sessions);
  const rs = sharedCount ? "r-shared" : ss.some(s => s.state === "busy") ? "r-busy" : ss.some(s => s.state === "idle") ? "r-idle" : ss.length ? "r-closed" : "";
  const n = r.loose_branches.length;
  const loose = n ? `<details class="loose" data-loose="${esc(r.key)}" ${openLoose.has(r.key) ? "open" : ""}><summary>${n} other branch${n === 1 ? "" : "es"} without a worktree</summary><div class="bchips">${r.loose_branches.map(b => `<span>${esc(b)}</span>`).join("")}</div></details>` : "";
  const note = r.error ? `<p class="card-error">${esc(r.error)}</p>` : r.nogit ? `<p class="nogit">Not a git repository, so there is no branch graph.</p>` : "";
  return `<article class="card" data-key="${esc(r.key)}">
    <div class="card-head"><span class="rdot ${rs}"></span><h2>${esc(r.name)}</h2><span class="counts">${counts}</span><span class="path">${esc(shortPath(r.root))}</span></div>
    <div class="card-body">${note}
      <div class="graph"><svg aria-hidden="true"></svg>${ordered(r).map(x => nodeRow(r, x.n, x.d)).join("")}</div>
      ${loose}
    </div>
  </article>`;
}

// Draw fork lines: down from the parent dot, then curve right into the child dot.
function drawGraphs() {
  document.querySelectorAll(".graph").forEach(g => {
    const svg = g.querySelector("svg");
    const box = g.getBoundingClientRect();
    const pos = {};
    g.querySelectorAll(".dot").forEach(el => {
      const b = el.getBoundingClientRect();
      pos[el.dataset.node] = { x: b.left - box.left + b.width / 2, y: b.top - box.top + b.height / 2, ghost: el.classList.contains("ghost") };
    });
    let paths = "";
    g.querySelectorAll(".dot[data-parent]").forEach(el => {
      const p = pos[el.dataset.parent], c = pos[el.dataset.node];
      if (!p || !c || c.y <= p.y) return;
      const r = 8;
      paths += `<path class="${p.ghost ? "from-ghost" : ""}" d="M${p.x} ${p.y + 7} L${p.x} ${c.y - r} Q${p.x} ${c.y} ${p.x + r} ${c.y} L${c.x - 7} ${c.y}"/>`;
    });
    svg.setAttribute("width", box.width);
    svg.setAttribute("height", box.height);
    svg.innerHTML = paths;
  });
}

function renderHeader() {
  const all = allSessions();
  const count = st => all.filter(x => x.s.state === st).length;
  const shared = board ? board.repos.reduce((k, r) => k + r.nodes.filter(n => n.shared).length, 0) : 0;
  const chips = [["all", "All", all.length, ""], ["idle", "Your turn", count("idle"), "c-idle"], ["busy", "Working", count("busy"), "c-busy"],
                 ["closed", "Closed · 24 h", count("closed"), "c-closed"], ["shared", "Shared worktree", shared, "c-shared"]];
  document.getElementById("filters").innerHTML = chips.map(([k, l, c, cls]) =>
    `<button type="button" class="chip ${cls}" data-filter="${k}" aria-pressed="${filter === k}"><b>${c}</b>${l}</button>`).join("");
  const live = all.filter(x => x.s.live).length;
  document.getElementById("sub").textContent = board ? `${live} live · ${board.repos.length} folder${board.repos.length === 1 ? "" : "s"}` : "";

  const items = (board ? board.alerts : []).map(a => {
    if (a.kind === "shared") return { cls: "warn", k: "Shared worktree", t: a.text, a: a.repo };
    if (a.kind === "waiting") return { cls: "ok", k: "Waiting " + fmt(Number(a.detail) || 0), t: a.text, a: a.repo };
    return { cls: "info", k: "Branch switched", t: `${a.text} (${a.detail})`, a: a.repo };
  });
  document.getElementById("alerts").innerHTML = items.map(i =>
    `<button type="button" class="alert ${i.cls}" data-jump="${esc(i.a)}"><span class="k">${esc(i.k)}</span><span class="t">${esc(i.t)}</span></button>`).join("");
  const warn = board && board.warnings.length ? ` ${board.warnings.length} file(s) could not be read: ${board.warnings.slice(0, 3).join("; ")}` : "";
  document.getElementById("foot").textContent = "Parent branches are inferred from the nearest fork point, since git does not record them. Closed sessions stay listed for 24 hours." + warn;
}

function renderFreshness() {
  const live = document.getElementById("live");
  live.classList.toggle("down", serverDown);
  document.getElementById("fresh").textContent = serverDown ? "Disconnected" :
    board ? `Updated ${new Date(board.generated_at).toLocaleTimeString()} · every 3 s` : "Connecting…";
  document.getElementById("down").hidden = !serverDown;
  document.getElementById("board").classList.toggle("stale", serverDown);
}

function render() {
  lastRender = Date.now();
  renderHeader();
  renderFreshness();
  const el = document.getElementById("board");
  if (!board) { el.innerHTML = ""; return; }
  el.innerHTML = board.repos.length ? board.repos.map(card).join("")
    : `<div class="empty"><strong>No Claude Code sessions found.</strong>Start <code>claude</code> in any repo and it appears here within 3 seconds.</div>`;
  drawGraphs();
}

async function poll() {
  if (inFlight) return;
  inFlight = true;
  try {
    const r = await fetch("/api/board", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    const data = JSON.parse(text);
    const sig = text.replace(/"generated_at":\d+/, "");
    const wasDown = serverDown;
    serverDown = false;
    // Re-render only on change (or to tick the clocks), so clicks are not lost mid-render.
    if (sig !== signature || wasDown || Date.now() - lastRender > CLOCK_MS) {
      signature = sig;
      board = data;
      render();
    } else {
      board.generated_at = data.generated_at;
      renderFreshness();
    }
  } catch (e) {
    if (!serverDown) { serverDown = true; renderFreshness(); }
  } finally {
    inFlight = false;
  }
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "X-Session-Tree": "1", "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }
  if (!r.ok) throw new Error((data && data.detail) || "Request failed (HTTP " + r.status + ")");
  return data;
}

let toastTimer = null;
function showToast({ title, msg = "", cmd = "", tabs = null, sid = "", error = false, autoHide = 0 }) {
  const t = document.getElementById("toast");
  const tabList = tabs ? `<div class="tabs">${tabs.map(x => `<button type="button" class="btn ghost" data-act="pick" data-sid="${esc(sid)}" data-title="${esc(x)}">${esc(x)}</button>`).join("")}</div>` : "";
  t.className = "toast" + (error ? " error" : "");
  t.innerHTML = `<div class="toast-head"><span>${esc(title)}</span><button type="button" class="btn ghost" data-act="toast-close">Close</button></div>
    ${msg ? `<p>${esc(msg)}</p>` : ""}${cmd ? `<pre>${esc(cmd)}</pre>` : ""}${tabList}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  if (autoHide) toastTimer = setTimeout(() => { t.hidden = true; }, autoHide);
}

function findSession(id) { return allSessions().find(x => x.s.id === id); }

function focusResult(res, sid, title) {
  if (res.result === "ok") return showToast({ title: `Switched to "${title}"`, autoHide: 2500 });
  if (res.result === "no_foreground") return showToast({ title: "Tab selected, but Windows kept this window in front", msg: "Look for the flashing Windows Terminal icon on the taskbar." });
  if (res.result === "not_found" || res.result === "ambiguous") {
    const why = res.result === "ambiguous" ? `More than one tab is called "${title}".` : `No Windows Terminal tab is called "${title}".`;
    return showToast({ title: "Pick the tab for this session", msg: why + " Choose the right one below.", tabs: res.tabs || [], sid });
  }
  showToast({ title: "Could not switch to the terminal", msg: res.detail || "The focus helper did not answer.", error: true });
}

async function act(button, fn) {
  button.disabled = true;
  try { await fn(); } catch (e) { showToast({ title: "Action failed", msg: e.message, error: true }); }
  finally { button.disabled = false; }
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.filter) { filter = t.dataset.filter; render(); return; }
  if (t.dataset.jump) {
    const el = [...document.querySelectorAll(".card")].find(c => c.dataset.key === t.dataset.jump);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    return;
  }
  if (t.classList.contains("sess")) { openId = openId === t.dataset.sid ? null : t.dataset.sid; render(); return; }
  const a = t.dataset.act;
  if (a === "close-detail") { openId = null; render(); return; }
  if (a === "toast-close") { document.getElementById("toast").hidden = true; return; }
  if (a === "goto") {
    const x = findSession(t.dataset.sid);
    act(t, async () => focusResult(await post(`/api/sessions/${encodeURIComponent(t.dataset.sid)}/focus`), t.dataset.sid, x ? x.s.title : ""));
    return;
  }
  if (a === "pick") {
    act(t, async () => focusResult(await post(`/api/sessions/${encodeURIComponent(t.dataset.sid)}/focus`, { title: t.dataset.title }), t.dataset.sid, t.dataset.title));
    return;
  }
  if (a === "resume") {
    act(t, async () => {
      const res = await post(`/api/sessions/${encodeURIComponent(t.dataset.sid)}/resume`);
      showToast({ title: res.via === "wt" ? "Opened a new Windows Terminal tab" : "Opened a new console window", cmd: res.command.join(" "), autoHide: 6000 });
    });
    return;
  }
  if (a === "new") {
    act(t, async () => {
      const res = await post("/api/worktrees/new", { path: t.dataset.path });
      showToast({ title: "Started a new Claude Code session", cmd: res.command.join(" "), autoHide: 6000 });
    });
  }
});

document.addEventListener("toggle", e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.loose) {
    if (d.open) openLoose.add(d.dataset.loose); else openLoose.delete(d.dataset.loose);
    drawGraphs();
  }
}, true);
if (window.ResizeObserver) new ResizeObserver(drawGraphs).observe(document.getElementById("board"));

render();
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
